<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06070f" />
      <stop offset="55%" stop-color="#190a2e" />
      <stop offset="100%" stop-color="#2c0d3d" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe66d" />
      <stop offset="48%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160928" />
      <stop offset="100%" stop-color="#05060c" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="sunClip">
      <circle cx="400" cy="245" r="110" />
    </clipPath>
  </defs>

  <rect width="800" height="310" fill="url(#sky)" />

  <!-- Stars -->
  <g fill="#eef4ff" opacity="0.75">
    <circle cx="92" cy="64" r="1.5" />
    <circle cx="176" cy="112" r="1.2" />
    <circle cx="240" cy="48" r="1.8" />
    <circle cx="315" cy="92" r="1.1" />
    <circle cx="520" cy="68" r="1.6" />
    <circle cx="618" cy="108" r="1.3" />
    <circle cx="695" cy="54" r="1.9" />
    <circle cx="740" cy="134" r="1.2" />
    <circle cx="132" cy="172" r="1.1" />
    <circle cx="660" cy="176" r="1.5" />
  </g>

  <!-- Neon Sun -->
  <circle cx="400" cy="245" r="118" fill="#ff2a85" opacity="0.22" filter="url(#glow)" />
  <g clip-path="url(#sunClip)">
    <rect x="290" y="135" width="220" height="220" fill="url(#sun)" />
    <rect x="280" y="232" width="240" height="6" fill="#190a2e" />
    <rect x="280" y="250" width="240" height="9" fill="#190a2e" />
    <rect x="280" y="272" width="240" height="12" fill="#190a2e" />
    <rect x="280" y="296" width="240" height="16" fill="#190a2e" />
  </g>

  <!-- Mountains Silhouette -->
  <polygon points="0,310 95,240 185,292 265,248 335,310" fill="#0d081d" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1.5" />
  <polygon points="465,310 545,252 628,288 710,234 800,310" fill="#0d081d" stroke="#ff2a85" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Ground -->
  <rect y="310" width="800" height="190" fill="url(#ground)" />
  <line x1="0" y1="310" x2="800" y2="310" stroke="#00f5ff" stroke-width="2.5" filter="url(#glow)" />

  <!-- Perspective Grid -->
  <g stroke="#00f5ff" stroke-opacity="0.45" stroke-width="1.2">
    <line x1="0" y1="330" x2="800" y2="330" />
    <line x1="0" y1="356" x2="800" y2="356" />
    <line x1="0" y1="390" x2="800" y2="390" />
    <line x1="0" y1="436" x2="800" y2="436" />
    <line x1="0" y1="490" x2="800" y2="490" />

    <line x1="400" y1="310" x2="400" y2="500" />
    <line x1="360" y1="310" x2="220" y2="500" />
    <line x1="320" y1="310" x2="40" y2="500" />
    <line x1="280" y1="310" x2="-140" y2="500" />
    <line x1="440" y1="310" x2="580" y2="500" />
    <line x1="480" y1="310" x2="760" y2="500" />
    <line x1="520" y1="310" x2="940" y2="500" />
  </g>

  <text x="32" y="468" fill="#00f5ff" font-family="monospace" font-size="14" letter-spacing="4" opacity="0.8">
    SECTOR 07 // SYNTH HORIZON
  </text>
</svg>
